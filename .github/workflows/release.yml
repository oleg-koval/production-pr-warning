name: Release

# Pushing a tag like v1.6.0 builds the zip, attaches it to a GitHub release and submits it to the
# Chrome Web Store. The tag must match manifest.json, because the store rejects a reused version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches manifest.json
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match manifest.json version $version"
            exit 1
          fi

      - name: Build the zip
        id: zip
        run: echo "path=$(scripts/package.sh)" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.zip.outputs.path }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            awk -v h="## ${TAG#v} " 'index($0, h) == 1 {p = 1; next} /^## / {p = 0} p' CHANGELOG.md > notes.md
            gh release create "$TAG" "$ZIP" --verify-tag --title "PR Redline ${TAG#v}" --notes-file notes.md
          fi

      - name: Submit to the Chrome Web Store
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: bddnpilanolcofleogjnpceflakmpgea
        run: scripts/publish-store.sh "${{ steps.zip.outputs.path }}"
