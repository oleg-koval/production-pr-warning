name: Release

# Merging a version bump in manifest.json into main tags it (v1.6.1), builds the zip, attaches it to
# a GitHub release and submits it to the Chrome Web Store. Pushing a tag by hand still works too.
# The tag must match manifest.json, because the store rejects a reused version.
on:
  push:
    branches: [main]
    paths: [manifest.json]
    tags: ['v*']

permissions:
  contents: write

# One group for all runs: every run uploads to the same store item.
concurrency:
  group: release

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # On main, a manifest.json change that is not a new version (or a version already tagged)
      # releases nothing. A tag pushed with the workflow token starts no second run.
      - name: Pick the tag
        id: pick
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$(jq -r .version manifest.json)"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "$tag already exists, nothing to release"
            exit 0
          fi
          # Checked before tagging, so a missing section leaves no tag behind and a fixed merge retries.
          if ! awk -v h="## ${tag#v} " -f scripts/release-notes.awk CHANGELOG.md | grep -q '[^[:space:]]'; then
            echo "::error::CHANGELOG.md has no section for ${tag#v}"
            exit 1
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only reviewed code gets the store secrets: the tag must point at a commit already on main.
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points at $GITHUB_SHA, which is not on main"
            exit 1
          fi

      - name: Check the tag matches manifest.json
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match manifest.json version $version"
            exit 1
          fi

      - name: Build the zip
        id: zip
        run: echo "path=$(scripts/package.sh)" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.zip.outputs.path }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            awk -v h="## ${TAG#v} " -f scripts/release-notes.awk CHANGELOG.md > notes.md
            if ! grep -q '[^[:space:]]' notes.md; then
              echo "::error::CHANGELOG.md has no section for ${TAG#v}"
              exit 1
            fi
            gh release create "$TAG" "$ZIP" --verify-tag --title "PR Redline ${TAG#v}" --notes-file notes.md
          fi

      - name: Submit to the Chrome Web Store
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: bddnpilanolcofleogjnpceflakmpgea
        run: scripts/publish-store.sh "${{ steps.zip.outputs.path }}"
