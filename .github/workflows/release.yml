name: Release

# Pushing a tag like v1.6.0 builds the zip, attaches it to a GitHub release and submits it to the
# Chrome Web Store. The tag must match manifest.json, because the store rejects a reused version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

# One group for all tags: every run uploads to the same store item.
concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only reviewed code gets the store secrets: the tag must point at a commit already on main.
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points at $GITHUB_SHA, which is not on main"
            exit 1
          fi

      - name: Check the tag matches manifest.json
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match manifest.json version $version"
            exit 1
          fi

      - name: Build the zip
        id: zip
        run: echo "path=$(scripts/package.sh)" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.zip.outputs.path }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            # Release notes render every newline as a hard break, so join each
            # wrapped continuation line in CHANGELOG.md back onto its bullet.
            awk -v h="## ${TAG#v} " 'index($0, h) == 1 {p = 1; next} /^## / {p = 0} !p {next} /^  +[^ ]/ && n {sub(/^ +/, ""); buf[n] = buf[n] " " $0; next} {buf[++n] = $0} END {for (i = 1; i <= n; i++) print buf[i]}' CHANGELOG.md > notes.md
            if ! grep -q '[^[:space:]]' notes.md; then
              echo "::error::CHANGELOG.md has no section for ${TAG#v}"
              exit 1
            fi
            gh release create "$TAG" "$ZIP" --verify-tag --title "PR Redline ${TAG#v}" --notes-file notes.md
          fi

      - name: Submit to the Chrome Web Store
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: bddnpilanolcofleogjnpceflakmpgea
        run: scripts/publish-store.sh "${{ steps.zip.outputs.path }}"
