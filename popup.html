<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      @media (prefers-color-scheme: light) {
        .hint { color: #59636e; }
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0; width: 240px; padding: 14px;
        background: Canvas; color: CanvasText;
      }
      h1 { font-size: 13px; font-weight: 600; margin: 0 0 10px; }
      h2 { font-size: 12px; font-weight: 600; margin: 14px 0 8px; }
      .hint { color: #8b949e; font-size: 11px; font-weight: 400; }
      .toggle {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        padding: 8px 10px; margin-bottom: 6px; font-size: 12px; cursor: pointer;
        border: 1px solid color-mix(in srgb, GrayText 40%, transparent); border-radius: 8px;
      }
      .toggle:hover { border-color: #2f81f7; }
      .toggle input { margin: 0; accent-color: #cf222e; }
      .swatches { display: flex; gap: 6px; }
      .swatch {
        flex: 1; height: 28px; padding: 0; cursor: pointer;
        border: 1px solid color-mix(in srgb, GrayText 40%, transparent); border-radius: 8px;
        border-top-width: 4px;
      }
      .swatch:hover { border-color: #2f81f7; }
      .swatch.active { outline: 2px solid #2f81f7; outline-offset: 1px; }
      .footer { margin-top: 12px; }
      #open-settings {
        display: flex; align-items: center; gap: 6px; width: 100%; justify-content: center;
        padding: 7px; font-size: 12px; cursor: pointer;
        border: 1px solid color-mix(in srgb, GrayText 40%, transparent);
        border-radius: 8px; background: transparent; color: inherit;
      }
      #open-settings svg { fill: currentColor; }
      #open-settings:hover { border-color: #2f81f7; }
    </style>
  </head>
  <body>
    <h1>GitHub PR Redline</h1>
    <label class="toggle">Tint protected PRs <input type="checkbox" id="tintEnabled" /></label>
    <label class="toggle">Show open protected PRs block <input type="checkbox" id="showBlock" /></label>
    <h2>Background <span class="hint" id="branches"></span></h2>
    <div class="swatches" id="swatches"></div>
    <div class="footer">

</html>
