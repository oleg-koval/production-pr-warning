<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1f2328; --muted: #59636e; --border: #d0d7de; --canvas: #ffffff; --subtle: #f6f8fa;
        --accent: #0969da;
        /* popup.js overwrites these with the saved colours, and live while the wheel moves. */
        --tint-light: #ffebe9; --tint-dark: #2d1215; --bar: #cf222e;
        --tint: var(--tint-light); --bar-text: var(--bar);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e6edf3; --muted: #8b949e; --border: #30363d; --canvas: #0d1117; --subtle: #161b22;
          --accent: #2f81f7;
          --tint: var(--tint-dark); --bar-text: color-mix(in srgb, var(--bar) 55%, white);
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 280px; margin: 0; background: var(--canvas); color: var(--fg);
        font: 12px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      button { font: inherit; color: inherit; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; border-radius: 6px; }

      /* The status card shows the tab's group colours, set inline by popup.js. */
      .status { --tint: var(--tint-light); --bar-text: var(--bar); }
      @media (prefers-color-scheme: dark) {
        .status { --tint: var(--tint-dark); --bar-text: color-mix(in srgb, var(--bar) 55%, white); }
      }
      .status { margin: 12px; padding: 10px 12px; border-radius: 8px; background: var(--tint); border-left: 4px solid var(--bar); }
      .status.calm { background: var(--subtle); border-left-color: var(--muted); }
      .status .k { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
      .status .v { font-size: 15px; font-weight: 600; margin: 2px 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .status .v code { font-size: 13px; padding: 1px 6px; color: var(--bar-text); background: color-mix(in srgb, var(--bar) 14%, transparent); overflow-wrap: anywhere; }
      .status.calm .v code { color: var(--fg); background: color-mix(in srgb, var(--muted) 16%, transparent); }

      .switches { display: grid; margin: 0 12px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
      .switches button {
        display: grid; grid-template-columns: 14px 1fr; column-gap: 8px; align-items: center; text-align: left;
        padding: 6px 10px; cursor: pointer; background: none; border: 0; border-bottom: 1px solid var(--border);
      }
      .switches button:last-child { border-bottom: 0; }
      .switches button:hover { background: var(--subtle); }
      .switches button::before {
        content: '✓'; grid-row: span 2; width: 14px; height: 14px; border: 1px solid var(--muted); border-radius: 4px;
        font-size: 10px; line-height: 13px; text-align: center; color: transparent;
      }
      .switches button[aria-pressed='true']::before { background: var(--accent); border-color: var(--accent); color: #fff; }
      .switches b { font-weight: 600; }
      .switches small { font-size: 12px; color: var(--muted); }
      .switches button:focus-visible { outline-offset: -3px; }

      .lbl { padding: 12px 12px 6px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

      .lbl .link { margin-left: auto; font-weight: 400; }

      .groups { display: flex; flex-direction: column; gap: 6px; padding: 0 12px; }
      .group { display: flex; align-items: flex-start; gap: 8px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; }
      .group[aria-current='true'] { border-color: var(--accent); }
      .group .swatch { flex: none; }
      .add-group {
        display: block; width: calc(100% - 24px); margin: 6px 12px 0; padding: 6px 0; cursor: pointer;
        border: 1px dashed var(--border); border-radius: 8px; background: none; color: var(--muted); font-weight: 600;
      }
      .add-group:hover { color: var(--fg); border-color: var(--muted); }
      .add-group[hidden] { display: none; }
      .save-error { margin: 8px 12px 0; font-size: 12px; color: #cf222e; }

      .chips { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; min-width: 0; }
      .chips ul { display: contents; }
      .chips li { list-style: none; display: inline-flex; align-items: center; background: var(--subtle); border: 1px solid var(--border); border-radius: 6px; }
      .chips li code { padding: 2px 0 2px 8px; }
      .chips li button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 6px; font-size: 14px; line-height: 20px; border-radius: 6px; }
      .chips li button:hover { color: var(--fg); }
      .chips .add { border: 1px dashed var(--border); border-radius: 6px; background: none; color: var(--muted); padding: 2px 8px; cursor: pointer; }
      .chips .add:hover { color: var(--fg); border-color: var(--muted); }
      .chips input { width: 110px; padding: 2px 6px; border: 1px solid var(--accent); border-radius: 6px; background: var(--canvas); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); }

      .swatches { display: flex; gap: 6px; padding: 0 12px; }
      .swatch {
        width: 26px; height: 22px; padding: 0; cursor: pointer; border-radius: 6px;
        border: 1px solid var(--border); border-top: 4px solid var(--b); background: var(--l);
      }
      @media (prefers-color-scheme: dark) { .swatch { background: var(--d); } }
      .swatch[aria-pressed='true'], .custom.active { outline: 2px solid var(--accent); outline-offset: 1px; }
      .custom {
        width: 22px; height: 22px; padding: 0; margin-left: auto; cursor: pointer; border-radius: 50%;
        border: 1px solid var(--border);
        background: radial-gradient(closest-side, #888, transparent),
          conic-gradient(hsl(0 80% 50%), hsl(60 80% 50%), hsl(120 80% 50%), hsl(180 80% 50%), hsl(240 80% 50%), hsl(300 80% 50%), hsl(360 80% 50%));
      }

      .picker { display: flex; gap: 14px; align-items: center; margin: 10px 12px 0; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--subtle); }
      .picker[hidden] { display: none; }
      .wheel {
        position: relative; flex: none; width: 104px; height: 104px; border-radius: 50%; cursor: crosshair; touch-action: none;
        background: radial-gradient(closest-side, #888, transparent),
          conic-gradient(hsl(0 80% 50%), hsl(60 80% 50%), hsl(120 80% 50%), hsl(180 80% 50%), hsl(240 80% 50%), hsl(300 80% 50%), hsl(360 80% 50%));
      }
      .wheel:focus-visible { outline-offset: 3px; }
      .knob {
        position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; pointer-events: none;
        background: var(--bar); border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.3);
      }
      .combo { display: grid; gap: 6px; min-width: 0; }
      .combo div { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
      .combo i { flex: none; width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--border); }
      .combo code { margin-left: auto; font-size: 12px; color: var(--fg); }
      .combo p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

      footer { display: flex; align-items: center; justify-content: space-between; padding: 12px; }
      .brand { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--muted); }
      .link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; }
      .link:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <section class="status calm" id="status" aria-live="polite">
      <div class="v" style="font-size: 13px">Checking this tab…</div>
    </section>

    <div class="lbl" id="show-label" style="padding-top: 0">Show on GitHub</div>
    <div class="switches" role="group" aria-labelledby="show-label">
      <button type="button" data-setting="tintEnabled"><b>Tint PR pages</b><small>Background and top bar of the PR</small></button>
      <button type="button" data-setting="showBlock"><b>Other open PRs</b><small>Same-colour PRs, in the PR sidebar</small></button>
      <button type="button" data-setting="highlightList"><b>Mark PR lists</b><small>Coloured rows on the Pull requests tab</small></button>
    </div>

    <div class="lbl" id="groups-label">Branches by colour</div>
    <div class="groups" id="groups" role="list" aria-labelledby="groups-label"></div>
    <button type="button" class="add-group" id="add-group">+ Add colour</button>
    <p class="save-error" id="save-error" role="alert" hidden></p>

    <div class="lbl"><span id="colour-label">Colour of the selected row</span><button type="button" class="link" id="remove-group" hidden>Remove colour</button></div>
    <div class="swatches" role="group" aria-labelledby="colour-label">
      <span id="presets" style="display: contents"></span>
      <button type="button" class="custom" id="custom" aria-label="Custom colour" title="Custom colour" aria-expanded="false" aria-controls="picker"></button>
    </div>
    <div class="picker" id="picker" hidden>
      <div class="wheel" id="wheel" role="slider" tabindex="0" aria-label="Colour, arrows change hue and strength" aria-valuemin="0" aria-valuemax="359">
        <span class="knob" id="knob"></span>
      </div>
      <div class="combo" aria-label="Colours this pick sets">
        <div><i id="swatch-light"></i>Light<code id="hex-light"></code></div>
        <div><i id="swatch-dark"></i>Dark<code id="hex-dark"></code></div>
        <div><i id="swatch-bar"></i>Bar<code id="hex-bar"></code></div>
        <p>Centre is greyer. Fine-tune each colour in All settings.</p>
      </div>
    </div>

    <footer>
      <span class="brand"><img src="icons/icon-32.png" width="16" height="16" alt="" />PR Redline</span>
      <button type="button" class="link" id="open-settings">All settings →</button>
    </footer>

    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
